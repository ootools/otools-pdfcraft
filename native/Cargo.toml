# PdfCraft 的 OTools 插件 native 适配层。
#
# 上游 `crates/automation` 已经有完整的 headless 自动化层（进程内 Session，无窗口），
# 依赖里没有 eframe/wgpu。本 crate 只做两件事：
#   1. 把上游 `tools()`（`Vec<ToolDef>`）转成宿主契约的 { tools: [...] }
#   2. 把宿主传入的 { name, arguments } 转成上游 `Automation::call(...)`
# 业务逻辑一律复用上游，不在此重写。
#
# 与 `shell/` 一样是**独立 workspace**：上游 workspace 是 wasm/desktop 导向，
# 并进来会让宿主的 cargo build 也去编译 UI 依赖。
[package]
name = "otools-pdfcraft-native"
description = "PdfCraft as an OTools plugin: headless MCP backend over the upstream pdfcraft-automation crate"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
name = "otools_pdfcraft_native"

[dependencies]
# `mcp` feature 必须开：适配层现在整体走上游 `McpServer` 的分发（tools / resources
# 都在里面）。关掉它就只能退回手写映射，资源表也就没了。
pdfcraft-automation = { path = "../upstream/crates/automation", default-features = false, features = ["mcp"] }
serde_json = "1"

# 上游 workspace 里的 `[patch.crates-io]` **不会**跟着 path 依赖带过来：
# 补丁只在发起构建的那个 workspace 根节点生效。少了这一段，hayro / lopdf /
# egui-wgpu 会退到 crates.io 的未打补丁版本（上游 vendor/ 里是改过的）。
# 上游更新后要同步这里 —— 见 AGENTS.md。
[patch.crates-io]
hayro = { path = "../upstream/vendor/hayro" }
hayro-interpret = { path = "../upstream/vendor/hayro-interpret" }
hayro-syntax = { path = "../upstream/vendor/hayro-syntax" }
hayro-jbig2 = { path = "../upstream/vendor/hayro-jbig2" }
lopdf = { path = "../upstream/vendor/lopdf" }
winit = { path = "../upstream/vendor/winit" }
egui-wgpu = { path = "../upstream/vendor/egui-wgpu" }

# cdylib 必须可 unwind：插件 FFI 边界在插件内部捕获 panic，
# 若 release profile 设成 abort，宿主会整体被杀（见主仓 ot-plugin-ffi 的说明）。
[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 16
