vello_common = { path = "../upstream/vendor/vello_common" }
vello_cpu = { path = "../upstream/vendor/vello_cpu" }

# END port-kit framework patch
[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 16
